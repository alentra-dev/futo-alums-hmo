name: Change subscriber access email

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate or apply the account access email change
        required: true
        type: choice
        options: [dry_run, apply]
        default: dry_run
      confirmation:
        description: Enter CHANGE-SUBSCRIBER-EMAIL when mode is apply
        required: false
        type: string

permissions:
  contents: read

jobs:
  change-email:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Confirm production change
        if: inputs.mode == 'apply' && inputs.confirmation != 'CHANGE-SUBSCRIBER-EMAIL'
        run: exit 1
      - name: Install temporary operation key
        id: key
        run: |
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          supabase secrets set account_email_change_key="$KEY" --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy guarded function
        run: supabase functions deploy change-subscriber-access-email --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Validate or apply
        env:
          OPERATION_KEY: ${{ steps.key.outputs.key }}
          MODE: ${{ inputs.mode }}
          OLD_EMAIL: ${{ secrets.ACCOUNT_EMAIL_OLD }}
          NEW_EMAIL: ${{ secrets.ACCOUNT_EMAIL_NEW }}
          ACTOR_EMAIL: ${{ secrets.ACCOUNT_EMAIL_ACTOR }}
        run: |
          jq -n --arg mode "$MODE" --arg oldEmail "$OLD_EMAIL" --arg newEmail "$NEW_EMAIL" --arg actorEmail "$ACTOR_EMAIL" \
            '{mode:$mode,oldEmail:$oldEmail,newEmail:$newEmail,actorEmail:$actorEmail}' > /tmp/request.json
          curl --fail-with-body --silent --show-error \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/change-subscriber-access-email" \
            -H "content-type: application/json" \
            -H "x-operation-key: $OPERATION_KEY" \
            --data @/tmp/request.json
      - name: Rotate operation key
        if: always() && steps.key.outputs.key != ''
        run: supabase secrets set account_email_change_key="$(openssl rand -hex 32)" --project-ref "$SUPABASE_PROJECT_ID"
