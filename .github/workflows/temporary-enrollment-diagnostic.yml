name: Temporary enrollment diagnostic

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy or delete the private diagnostic function
        required: true
        type: choice
        options: [deploy, delete]

permissions:
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Deploy diagnostic function
        if: inputs.operation == 'deploy'
        run: supabase functions deploy diagnose-subscriber-enrollment --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Delete diagnostic function
        if: inputs.operation == 'delete'
        run: supabase functions delete diagnose-subscriber-enrollment --project-ref "$SUPABASE_PROJECT_ID" --yes
