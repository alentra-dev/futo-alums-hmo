name: Deploy Supabase schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview migrations
        run: supabase db push --linked --include-all --dry-run
      - name: Apply migrations
        run: supabase db push --linked --include-all
      - name: Apply Auth configuration
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy change-subscriber-access-email --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy send-2026-renewal-invitations --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
