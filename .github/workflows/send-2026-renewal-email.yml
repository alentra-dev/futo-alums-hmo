name: Send 2026 renewal email

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate recipients or send the idempotent campaign
        required: true
        type: choice
        options: [dry_run, send]
        default: dry_run
      confirmation:
        description: Enter SEND-2026-RENEWALS when mode is send
        required: false
        type: string

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Confirm production send
        if: inputs.mode == 'send' && inputs.confirmation != 'SEND-2026-RENEWALS'
        run: exit 1
      - name: Link and migrate
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --linked --include-all
      - name: Install temporary invocation key
        id: key
        run: |
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          supabase secrets set invitation_batch_key="$KEY" --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy guarded campaign function
        run: supabase functions deploy send-2026-renewal-invitations --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Validate or send
        env:
          BATCH_KEY: ${{ steps.key.outputs.key }}
          MODE: ${{ inputs.mode }}
        run: |
          curl --fail-with-body --silent --show-error \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/send-2026-renewal-invitations" \
            -H "content-type: application/json" \
            -H "x-batch-key: $BATCH_KEY" \
            --data "{\"mode\":\"$MODE\"}"
      - name: Rotate invocation key
        if: always() && steps.key.outputs.key != ''
        run: supabase secrets set invitation_batch_key="$(openssl rand -hex 32)" --project-ref "$SUPABASE_PROJECT_ID"
